<html>
<head>
  <script type="module" src="/plugins/chat_organizer/webui/chat_organizer_store.js"></script>
</head>
<body>
  <div x-data>
    <template x-if="$store.chatOrganizer">
      <div class="chat-organizer-root"
           x-init="$store.chatOrganizer.onOpen()"
           x-destroy="$store.chatOrganizer.cleanup()"
           @click.outside="$store.chatOrganizer.closeContextMenu(); $store.chatOrganizer.closeChatContextMenu()">

        <div class="co-header">
          <span class="section-header">Folders</span>
          <div class="co-header-actions">
            <button class="btn-icon-action co-action-btn" @click="$store.chatOrganizer.showCreateFolder(null)" title="New Folder">
              <span class="material-symbols-outlined">create_new_folder</span>
            </button>
          </div>
        </div>

        <div class="co-tree-scroll">
          <template x-if="$store.chatOrganizer.isCreating()">
            <div class="co-folder-row co-create-row">
              <span class="material-symbols-outlined co-toggle-icon">create_new_folder</span>
              <input id="co-create-input" class="co-rename-input" placeholder="Folder name"
                     x-model="$store.chatOrganizer.createValue"
                     @keydown.enter="$store.chatOrganizer.finishCreate()"
                     @keydown.escape="$store.chatOrganizer.cancelCreate()"
                     @blur="$store.chatOrganizer.finishCreate()">
            </div>
          </template>
          <template x-if="$store.chatOrganizer.tree">
            <div>
              <template x-for="row in $store.chatOrganizer.getRows()" :key="row.key">
                <div>

                  <template x-if="row.type === 'folder'">
                    <div class="co-folder-row"
                         :data-folder-id="row.folder.id"
                         :class="{'co-active': $store.chatOrganizer.activeFilter === row.folder.id, 'co-drop-target': $store.chatOrganizer.dragOverFolderId === row.folder.id, 'co-nested-folder-row': row.depth > 0}"
                         :style="{ paddingLeft: (6 + row.depth * 24) + 'px', '--co-depth': row.depth }"
                         @dragenter="$store.chatOrganizer.dragOverFolder($event, row.folder.id)"
                         @dragover="$store.chatOrganizer.dragOverFolder($event, row.folder.id)"
                         @dragleave="$store.chatOrganizer.dragLeaveFolder($event, row.folder.id)"
                         @drop="$store.chatOrganizer.dropOnFolder($event, row.folder.id)">
                      <button class="co-toggle" @click="$store.chatOrganizer.toggleFolder(row.folder.id)">
                        <span class="material-symbols-outlined co-toggle-icon" x-text="$store.chatOrganizer.isExpanded(row.folder.id) ? 'folder_open' : 'folder'"></span>
                      </button>
                      <template x-if="$store.chatOrganizer.isEditing(row.folder.id)">
                        <input :id="'co-rename-' + row.folder.id" class="co-rename-input" x-model="$store.chatOrganizer.editValue"
                               @keydown.enter="$store.chatOrganizer.finishRename(row.folder.id)"
                               @keydown.escape="$store.chatOrganizer.cancelRename()"
                               @blur="$store.chatOrganizer.finishRename(row.folder.id)">
                      </template>
                      <template x-if="!$store.chatOrganizer.isEditing(row.folder.id)">
                        <span class="co-folder-name" @click="$store.chatOrganizer.setFilter(row.folder.id)" @contextmenu="$store.chatOrganizer.openContextMenu($event, row.folder.id)" x-text="row.folder.name"></span>
                      </template>
                      <span class="co-badge" x-text="$store.chatOrganizer.folderTotalChats(row.folder)"></span>
                      <button class="btn-icon-action co-menu-btn" @click.stop="$store.chatOrganizer.openContextMenu($event, row.folder.id)">
                        <span class="material-symbols-outlined">more_vert</span>
                      </button>
                    </div>
                  </template>

                  <template x-if="row.type === 'orphans'">
                    <div class="co-filter-row"
                         data-co-folder-drop="true"
                         data-folder-id=""
                         :class="{'co-active': $store.chatOrganizer.activeFilter === '', 'co-drop-target': $store.chatOrganizer.dragOverFolderId === '__orphans__'}"
                         @click="$store.chatOrganizer.setFilter('')"
                         @dragenter="$store.chatOrganizer.dragOverFolder($event, '')"
                         @dragover="$store.chatOrganizer.dragOverFolder($event, '')"
                         @dragleave="$store.chatOrganizer.dragLeaveFolder($event, '')"
                         @drop="$store.chatOrganizer.dropOnFolder($event, '')">
                      <span class="material-symbols-outlined co-toggle-icon">inbox</span>
                      <span class="co-folder-name">Unfiled</span>
                      <span class="co-badge" x-text="row.count"></span>
                    </div>
                  </template>

                  <template x-if="row.type === 'all'">
                    <div class="co-filter-row"
                         :class="{'co-active': $store.chatOrganizer.activeFilter === null}"
                         @click="$store.chatOrganizer.clearFilter()">
                      <span class="material-symbols-outlined co-toggle-icon">forum</span>
                      <span class="co-folder-name">All Chats</span>
                    </div>
                  </template>

                </div>
              </template>
            </div>
          </template>
        </div>

        <div class="co-resize-handle"
             title="Drag to resize folder panel (double-click to reset)"
             role="separator"
             aria-orientation="horizontal"
             aria-label="Resize folder panel"
             @pointerdown="$store.chatOrganizer.startPanelResize($event)"
             @dblclick="$store.chatOrganizer._resetPanelHeight()"></div>

        <!-- Folder context menu (rename, new subfolder, delete) -->
        <template x-if="$store.chatOrganizer.contextMenu">
          <div class="co-context-menu" :style="{position: 'fixed', left: $store.chatOrganizer.contextMenu.x + 'px', top: $store.chatOrganizer.contextMenu.y + 'px'}" @click.outside="$store.chatOrganizer.closeContextMenu()">
            <button class="co-menu-item" @click="$store.chatOrganizer.startRename($store.chatOrganizer.contextMenu.folderId)">
              <span class="material-symbols-outlined">edit</span> Rename
            </button>
            <button class="co-menu-item" @click="$store.chatOrganizer.showCreateFolder($store.chatOrganizer.contextMenu.folderId)">
              <span class="material-symbols-outlined">create_new_folder</span> New Subfolder
            </button>
            <hr class="co-menu-divider">
            <button class="co-menu-item co-menu-danger" @click="$store.chatOrganizer.deleteFolder($store.chatOrganizer.contextMenu.folderId)">
              <span class="material-symbols-outlined">delete</span> Delete Folder
            </button>
          </div>
        </template>

        <!-- Chat context menu (right-click a chat to move it to a folder) -->
        <template x-if="$store.chatOrganizer.chatContextMenu">
          <div class="co-context-menu" :style="{position: 'fixed', left: $store.chatOrganizer.chatContextMenu.x + 'px', top: $store.chatOrganizer.chatContextMenu.y + 'px'}" @click.outside="$store.chatOrganizer.closeChatContextMenu()">
            <div class="co-menu-header">
              <span x-text="$store.chatOrganizer.getChatCurrentFolderName($store.chatOrganizer.chatContextMenu.ctxid) ? 'In: ' + $store.chatOrganizer.getChatCurrentFolderName($store.chatOrganizer.chatContextMenu.ctxid) : 'Move to folder'"></span>
            </div>
            <hr class="co-menu-divider">
            <template x-for="f in $store.chatOrganizer.getFlatFolders()" :key="f.id">
              <button class="co-menu-item" @click="$store.chatOrganizer.moveChatToFolder($store.chatOrganizer.chatContextMenu.ctxid, f.id)">
                <span class="material-symbols-outlined" style="font-size:14px">folder</span>
                <span x-text="f.name"></span>
              </button>
            </template>
            <button class="co-menu-item" @click="$store.chatOrganizer.moveChatToFolder($store.chatOrganizer.chatContextMenu.ctxid, '')">
              <span class="material-symbols-outlined" style="font-size:14px">inbox</span> Unfiled
            </button>
            <hr class="co-menu-divider">
            <button class="co-menu-item co-menu-danger" @click="$store.chatOrganizer.removeChatFromFolder($store.chatOrganizer.chatContextMenu.ctxid)">
              <span class="material-symbols-outlined" style="font-size:14px">remove</span> Remove from folder
            </button>
          </div>
        </template>
      </div>
    </template>
  </div>

  <style>
    /* Chat Organizer: high-contrast, theme-safe styles.
       The plugin keeps the default .chat-container rows intact for compatibility,
       but all plugin-owned rows/menus use explicit scoped contrast colors so text
       remains readable across dark/light/custom themes. */
    .chat-organizer-root {
      --co-text: #f8fafc;
      --co-muted-text: #e2e8f0;
      --co-dim-text: #cbd5e1;
      --co-bg: rgba(15, 23, 42, 0.72);
      --co-row-bg: rgba(30, 41, 59, 0.58);
      --co-row-hover-bg: rgba(51, 65, 85, 0.9);
      --co-active-bg: #2563eb;
      --co-active-hover-bg: #1d4ed8;
      --co-active-text: #ffffff;
      --co-border: rgba(148, 163, 184, 0.45);
      --co-badge-bg: rgba(226, 232, 240, 0.20);
      --co-badge-text: #f8fafc;
      --co-danger: #fca5a5;
      --co-focus: #93c5fd;
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
      max-height: 35%;
      min-height: 80px;
      margin-bottom: var(--spacing-xs);
      border-bottom: 1px solid var(--co-border);
      padding-bottom: var(--spacing-xs);
      color: var(--co-text);
    }

    .chat-organizer-root * { box-sizing: border-box; }
    .co-header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; margin-bottom: 4px; color: var(--co-text); }
    .co-header .section-header { margin: 0; font-size: var(--font-size-small); color: var(--co-text); font-weight: 700; }
    .co-header-actions { display: flex; gap: 2px; }
    .co-action-btn { padding: 2px; color: var(--co-text) !important; border: 1px solid var(--co-border); background: rgba(15,23,42,0.45); }
    .co-action-btn:hover { background: var(--co-row-hover-bg); color: var(--co-active-text) !important; }
    .co-action-btn .material-symbols-outlined { font-size: 16px; color: currentColor !important; }
    .co-tree-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }

    .co-folder-row,
    .co-filter-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      border-radius: 5px;
      cursor: pointer;
      min-height: 28px;
      user-select: none;
      opacity: 1;
      color: var(--co-muted-text) !important;
      background: transparent;
      border: 1px solid transparent;
    }

    .co-folder-row:hover,
    .co-filter-row:hover {
      background: var(--co-row-hover-bg);
      color: var(--co-text) !important;
      border-color: var(--co-border);
    }

    .co-folder-row.co-nested-folder-row {
      position: relative;
    }

    .co-folder-row.co-nested-folder-row::before {
      content: "";
      position: absolute;
      left: calc(14px + (var(--co-depth, 1) - 1) * 24px);
      top: 5px;
      bottom: 5px;
      width: 2px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.42);
      pointer-events: none;
    }

    .co-folder-row.co-nested-folder-row.co-active::before,
    .co-folder-row.co-nested-folder-row:hover::before {
      background: rgba(255, 255, 255, 0.62);
    }

    .co-resize-handle {
      flex: 0 0 auto;
      height: 10px;
      margin: 4px 0 2px 0;
      cursor: ns-resize;
      position: relative;
      user-select: none;
      touch-action: none;
    }

    .co-resize-handle::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 3px;
      border-radius: 999px;
      background: var(--co-border, rgba(148, 163, 184, 0.45));
      transition: background 0.12s ease, height 0.12s ease, width 0.12s ease;
    }

    .co-resize-handle:hover::before,
    .co-resize-handle.co-resizing::before {
      background: var(--co-focus, #93c5fd);
      height: 4px;
      width: 72px;
    }

    body.co-resizing-folder-panel {
      cursor: ns-resize !important;
      user-select: none;
    }

    body.co-resizing-folder-panel * {
      cursor: ns-resize !important;
      user-select: none !important;
    }

    .co-folder-row.co-active,
    .co-filter-row.co-active {
      background: var(--co-active-bg) !important;
      color: var(--co-active-text) !important;
      border-color: var(--co-focus);
      opacity: 1;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
    }

    .co-folder-row.co-active:hover,
    .co-filter-row.co-active:hover {
      background: var(--co-active-hover-bg) !important;
      color: var(--co-active-text) !important;
    }

    .co-toggle { background: none; border: none; padding: 0; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; color: inherit !important; }
    .co-toggle-icon { font-size: 16px; color: currentColor !important; opacity: 0.95; }
    .co-folder-name { flex: 1; font-size: var(--font-size-small); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: currentColor !important; }

    .co-badge {
      font-size: 10px;
      font-weight: 700;
      background: var(--co-badge-bg);
      color: var(--co-badge-text) !important;
      border: 1px solid rgba(248,250,252,0.18);
      border-radius: 999px;
      padding: 0 5px;
      flex-shrink: 0;
      opacity: 1;
      line-height: 15px;
      min-width: 16px;
      text-align: center;
    }

    .co-folder-row.co-active .co-badge,
    .co-filter-row.co-active .co-badge {
      background: rgba(255,255,255,0.24);
      color: #ffffff !important;
      border-color: rgba(255,255,255,0.35);
    }

    .co-menu-btn { opacity: 0.85; flex-shrink: 0; color: currentColor !important; }
    .co-menu-btn .material-symbols-outlined { color: currentColor !important; }
    .device-pointer .co-folder-row:hover .co-menu-btn { opacity: 1; }
    .device-touch .co-menu-btn { opacity: 1; }
    .co-drop-target { outline: 2px dashed var(--co-focus) !important; background: rgba(37,99,235,0.22) !important; color: var(--co-text) !important; }

    .co-rename-input {
      flex: 1;
      font-size: var(--font-size-small);
      background: #0f172a;
      border: 1px solid var(--co-focus);
      border-radius: 4px;
      padding: 3px 5px;
      color: #ffffff !important;
      outline: none;
    }

    .co-context-menu {
      background: #0f172a;
      color: #f8fafc !important;
      border: 1px solid var(--co-border);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.55);
      padding: 4px 0;
      min-width: 180px;
      max-height: 70vh;
      overflow-y: auto;
      z-index: 1010;
    }
    .co-menu-header { padding: 6px 12px; font-size: var(--font-size-small); color: var(--co-dim-text) !important; font-weight: 650; }
    .co-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px; border: none; background: none; color: #f8fafc !important; font-size: var(--font-size-small); cursor: pointer; text-align: left; }
    .co-menu-item:hover { background: #1e40af; color: #ffffff !important; }
    .co-menu-item .material-symbols-outlined { font-size: 16px; color: currentColor !important; }
    .co-menu-danger { color: var(--co-danger) !important; }
    .co-menu-danger:hover { background: #7f1d1d; color: #ffffff !important; }
    .co-menu-divider { margin: 4px 0; border: none; border-top: 1px solid var(--co-border); }

    .chats-config-list .chat-container.co-chat-draggable { cursor: grab; touch-action: none; }
    .chats-config-list .chat-container.co-chat-dragging { opacity: 0.42; filter: saturate(0.8); }
    .chat-organizer-root .co-pointer-drop-target {
      background: rgba(37,99,235,0.30) !important;
      border-color: var(--co-focus) !important;
      box-shadow: inset 0 0 0 1px rgba(147,197,253,0.45), 0 0 0 2px rgba(37,99,235,0.18);
      color: #ffffff !important;
    }
    .co-drag-ghost {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 10000;
      max-width: 260px;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(147,197,253,0.65);
      background: rgba(15,23,42,0.94);
      color: #ffffff;
      font-size: var(--font-size-small);
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      will-change: transform;
    }
    .co-insert-marker {
      position: fixed;
      z-index: 9999;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent 0, #93c5fd 10%, #60a5fa 50%, #93c5fd 90%, transparent 100%);
      box-shadow: 0 0 0 1px rgba(15,23,42,0.75), 0 0 12px rgba(96,165,250,0.65);
      pointer-events: none;
      display: none;
    }
    body.co-chat-organizer-drag-active { user-select: none; cursor: grabbing !important; }
    body.co-chat-organizer-drag-active .chats-config-list .chat-container { cursor: grabbing !important; }
  </style>
</body>
</html>
