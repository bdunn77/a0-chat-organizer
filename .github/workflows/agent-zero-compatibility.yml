name: Agent Zero compatibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-zero-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Chat Organizer
        uses: actions/checkout@v4

      - name: Check out latest Agent Zero
        uses: actions/checkout@v4
        with:
          repository: agent0ai/agent-zero
          ref: main
          path: agent-zero
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        id: javascript
        continue-on-error: true
        run: node --check webui/chat_organizer_store.js

      - name: Test ordering behavior
        id: sorter
        continue-on-error: true
        run: node tests/check_sorter.mjs

      - name: Validate Python syntax
        id: python
        continue-on-error: true
        run: python -m py_compile api/tree_handler.py tests/check_compatibility.py

      - name: Validate plugin and latest Agent Zero contracts
        id: contracts
        continue-on-error: true
        run: python tests/check_compatibility.py --agent-zero agent-zero

      - name: Summarize result
        id: result
        shell: bash
        run: |
          outcomes=(
            "javascript=${{ steps.javascript.outcome }}"
            "sorter=${{ steps.sorter.outcome }}"
            "python=${{ steps.python.outcome }}"
            "contracts=${{ steps.contracts.outcome }}"
          )
          printf '%s\n' "${outcomes[@]}" | tee compatibility-results.txt
          if printf '%s\n' "${outcomes[@]}" | grep -q '=failure'; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "failed=false" >> "$GITHUB_OUTPUT"

      - name: Maintain compatibility alert issue
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          COMPATIBILITY_FAILED: ${{ steps.result.outputs.failed || 'true' }}
        with:
          script: |
            const title = "[compatibility] Agent Zero main compatibility check failed";
            const marker = "<!-- chat-organizer-compatibility-monitor -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "all", per_page: 100,
            });
            const issue = issues.find((item) => !item.pull_request && item.title === title && item.body?.includes(marker));
            const failed = process.env.COMPATIBILITY_FAILED === "true";
            if (failed) {
              const body = `${marker}\nThe automated compatibility suite failed against the latest \`agent0ai/agent-zero@main\`.\n\nLatest failing run: ${runUrl}\n\nThis issue is maintained automatically and will close after a successful compatibility run.`;
              if (!issue) {
                await github.rest.issues.create({ owner, repo, title, body });
              } else {
                if (issue.state === "closed") {
                  await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "open", body });
                } else {
                  await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
                }
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Compatibility failed again: ${runUrl}` });
              }
            } else if (issue?.state === "open") {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Compatibility recovered: ${runUrl}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
            }
